name: Deploy Monorepo to AWS EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script_stop: true
          script: |
            #!/bin/bash
            set -e

            cd /var/www/festive-express/festive-express-monorepo

            echo "── Preflight: disk space ──"
            FREE_GB=$(( $(df --output=avail . | tail -1) / 1024 / 1024 ))
            echo "Free disk: ${FREE_GB}GB"
            if [ "$FREE_GB" -lt 5 ]; then
              echo "ERROR: Only ${FREE_GB}GB free. Aborting."
              df -h .
              exit 1
            fi

            echo "── Reclaiming space and memory ──"
            pm2 flush 2>/dev/null || true
            npm cache clean --force 2>/dev/null || true
            rm -rf .staging apps/*-new apps/*-old apps/*/.next/cache 2>/dev/null || true

            # Force Linux to clear buff/cache to free up RAM for the build
            sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null 2>&1 || true

            sudo journalctl --vacuum-size=200M 2>/dev/null || true
            sudo apt clean 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true
            df -h
            free -h

            echo "── Fetching latest ──"
            git fetch origin production
            git reset --hard origin/production
            git log -1 --oneline

            echo "── Locating Node ──"
            if [ -d "$HOME/.nvm/versions/node" ]; then
              NODE_DIR=$(ls -d "$HOME"/.nvm/versions/node/v24.* 2>/dev/null | sort -V | tail -1)
              [ -z "$NODE_DIR" ] && NODE_DIR=$(ls -d "$HOME"/.nvm/versions/node/v20.* 2>/dev/null | sort -V | tail -1)
              [ -z "$NODE_DIR" ] && NODE_DIR=$(ls -d "$HOME"/.nvm/versions/node/*/ 2>/dev/null | sort -V | tail -1)
              [ -n "$NODE_DIR" ] && export PATH="$NODE_DIR/bin:$PATH"
            fi
            if ! command -v node >/dev/null 2>&1 && [ -s "$HOME/.nvm/nvm.sh" ]; then
              \. "$HOME/.nvm/nvm.sh"
              nvm use 24 2>/dev/null || nvm use 20 2>/dev/null || nvm use --lts 2>/dev/null || true
            fi
            if ! command -v node >/dev/null 2>&1; then
              for d in /usr/local/bin /usr/bin /opt/node/bin; do
                if [ -x "$d/node" ]; then
                  export PATH="$d:$PATH"
                  break
                fi
              done
            fi
            if ! command -v node >/dev/null 2>&1; then
              echo "ERROR: node not found anywhere."
              exit 1
            fi
            echo "Node: $(command -v node) | Version: $(node --version)"

            # Lowered to 512MB to force Node to use Swap safely without OOM crashing
             export NODE_OPTIONS="--max-old-space-size=2560"
            echo "── Memory ──"
            free -h

            # ==========================================
            # INSTALL DEPENDENCIES (Root level for Monorepo)
            # ==========================================
            echo "── Installing Dependencies ──"
            npm ci

            # ==========================================
            # STAGING BUILDS (Old app stays online)
            # Built in .staging/ so npm doesn't treat the copy
            # as a duplicate workspace. package.json stays intact.
            # ==========================================
            mkdir -p .staging

            echo "── Staging Storefront ──"
            cp -r apps/storefront .staging/storefront
            cd .staging/storefront
            rm -rf .nuxt .output .next dist node_modules
            ln -s ../../node_modules node_modules
            npm run build
            cd ../..

            echo "── Staging Admin ──"
            cp -r apps/admin .staging/admin
            cd .staging/admin
            rm -rf .nuxt .output .next dist node_modules
            ln -s ../../node_modules node_modules
            npm run build
            cd ../..

            # ==========================================
            # SWAP & DEPLOY (Downtime is seconds)
            # ==========================================

            echo "── Swapping new builds into place ──"
            mv apps/storefront apps/storefront-old
            mv .staging/storefront apps/storefront

            mv apps/admin apps/admin-old
            mv .staging/admin apps/admin

            echo "── Reloading PM2 ──"
            pm2 reload ecosystem.config.js --update-env
            pm2 save
            sleep 5
            pm2 list

            echo "── Post-deploy cleanup ──"
            rm -rf apps/storefront-old apps/admin-old .staging
            rm -rf apps/*/.nuxt/cache apps/*/.next/cache 2>/dev/null || true
            npm cache clean --force 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true

            echo "── Final state ──"
            df -h .
            free -h
            echo "Deployment complete!"
