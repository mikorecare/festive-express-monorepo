name: Deploy Monorepo to AWS EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Exit immediately if any command fails
            set -e

            # 2. Navigate to monorepo root
            cd /var/www/festive-express/festive-express-monorepo

            # 3. FORCE PULL the latest code from production branch
            echo "Pulling latest code from production branch..."
            git fetch origin production
            git reset --hard origin/production

            # 4. Load Node/NVM environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 5. Increase Node memory limit for builds
            export NODE_OPTIONS="--max-old-space-size=4096"

            # 6. Check available memory
            echo "Available memory before build:"
            free -h

            # ============================================
            # BUILD STOREFRONT (Sequential)
            # ============================================
            echo "========================================="
            echo "Building Storefront..."
            echo "========================================="
            cd /var/www/festive-express/festive-express-monorepo/apps/storefront

            # Install dependencies
            npm install

            # Clean old builds to free memory
            rm -rf .nuxt .output node_modules/.cache

            # Build
            npm run build

            # 7. Force memory cleanup before Admin build
            echo "Cleaning up memory before Admin build..."
            sync
            echo 3 | sudo tee /proc/sys/vm/drop_caches 2>/dev/null || true
            free -h

            # ============================================
            # BUILD ADMIN (Sequential)
            # ============================================
            echo "========================================="
            echo "Building Admin..."
            echo "========================================="
            cd /var/www/festive-express/festive-express-monorepo/apps/admin

            # Install dependencies
            npm install

            # Clean old builds
            rm -rf .nuxt .output node_modules/.cache

            # Build
            npm run build

            # 8. Force memory cleanup before restart
            echo "Cleaning up memory before PM2 restart..."
            sync
            echo 3 | sudo tee /proc/sys/vm/drop_caches 2>/dev/null || true

            # 9. HOT-RELOAD APPLICATIONS VIA PM2
            echo "========================================="
            echo "Hot-reloading applications with PM2..."
            echo "========================================="
            cd /var/www/festive-express/festive-express-monorepo

            # Reload without downtime
            pm2 reload ecosystem.config.js --update-env
            pm2 save

            # 10. Verify System Integrity
            echo "========================================="
            echo "PM2 Status:"
            pm2 list
            echo ""
            echo "Recent logs:"
            pm2 logs --lines 20 --nostream

            # 11. Final memory check
            echo ""
            echo "Available memory after build:"
            free -h

            echo "========================================="
            echo "Deployment complete!"
            echo "========================================="