name: Deploy Monorepo to AWS EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Exit immediately if any command fails
            set -e

            # 2. Navigate to monorepo root
            cd /var/www/festive-express/festive-express-monorepo

            # 3. FORCE PULL the latest code from production branch
            echo "Pulling latest code from production branch..."
            git fetch origin production
            git reset --hard origin/production

            # 4. Load Node/NVM environment rules cleanly
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 5. Verify vital API paths exist
            echo "Checking elavon API files..."
            ls -la apps/storefront/server/api/elavon/ || echo "Elavon directory not found!"

            # 6. ATOMIC BUILD: Storefront (Zero-Downtime)
            echo "Building Storefront..."
            cd /var/www/festive-express/festive-express-monorepo/apps/storefront
            npm install
            
            # Build safely into an isolated workspace directory to prevent live Nginx 502s
            NITRO_OUTPUT_DIR=./.output_temp npm run build
            
            # Instantly swap the old directory with the new directory at the OS level
            rm -rf .output .nuxt node_modules/.cache
            mv .output_temp .output

            # 7. ATOMIC BUILD: Admin (Zero-Downtime)
            echo "Building Admin..."
            cd /var/www/festive-express/festive-express-monorepo/apps/admin
            npm install
            
            # Build safely into an isolated workspace directory
            NITRO_OUTPUT_DIR=./.output_temp npm run build
            
            # Instantly swap the folders
            rm -rf .output .nuxt node_modules/.cache
            mv .output_temp .output

            # 8. HOT-RELOAD APPLICATION VIA PM2
            echo "Hot-reloading applications with PM2..."
            cd /var/www/festive-express/festive-express-monorepo
            
            # Enforce an active reload to safely swap memory mappings without closing connections
            pm2 reload ecosystem.config.js --update-env
            pm2 save

            # 9. Verify System Integrity
            pm2 list
            pm2 logs --lines 20 --nostream
