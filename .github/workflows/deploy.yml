name: Deploy Monorepo to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to monorepo root
            cd /var/www/festive-express/festive-express-monorepo

            # 2. FORCE PULL the latest code (THIS IS THE FIX)
            echo "Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master
            # This ensures the server EXACTLY matches the remote master

            # 3. Load Node/NVM environment rules
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 4. Verify the files exist after pull
            echo "Checking elavon API files..."
            ls -la apps/storefront/server/api/elavon/ || echo "Elavon directory not found!"

            # 5. BUILD & DEPLOY APP 1: Storefront
            echo "Building Storefront..."
            cd /var/www/festive-express/festive-express-monorepo/apps/storefront
            npm install
            rm -rf .output .nuxt node_modules/.cache
            npm run build

            # 6. BUILD & DEPLOY APP 2: Admin
            echo "Building Admin..."
            cd /var/www/festive-express/festive-express-monorepo/apps/admin
            npm install
            rm -rf .output .nuxt node_modules/.cache
            npm run build

            # 7. RESTART VIA PM2
            echo "Restarting applications with PM2..."
            cd /var/www/festive-express/festive-express-monorepo
            pm2 restart ecosystem.config.js --update-env
            pm2 save

            # 8. Check status
            pm2 list
            
            # 9. Show recent logs
            pm2 logs --lines 20 --nostream