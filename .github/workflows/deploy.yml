name: Deploy Monorepo to AWS EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            cd /var/www/festive-express/festive-express-monorepo

            echo "── Preflight: disk space ──"
            FREE_GB=$(( $(df --output=avail . | tail -1) / 1024 / 1024 ))
            echo "Free disk: ${FREE_GB}GB"
            if [ "$FREE_GB" -lt 3 ]; then
              echo "ERROR: Only ${FREE_GB}GB free. Aborting."
              df -h .
              exit 1
            fi

            echo "── Reclaiming space ──"
            pm2 flush 2>/dev/null || true
            npm cache clean --force 2>/dev/null || true
            rm -rf apps/*/.nuxt apps/*/.output apps/*/.next apps/*/dist 2>/dev/null || true
            find apps -type d -name ".cache" -prune -exec rm -rf {} + 2>/dev/null || true
            sudo journalctl --vacuum-size=200M 2>/dev/null || true
            sudo apt clean 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true
            df -h

            echo "── Fetching latest ──"
            git fetch origin production
            git reset --hard origin/production
            git log -1 --oneline

            echo "── Node environment ──"
            NODE_DIR=$(ls -d /home/ubuntu/.nvm/versions/node/v24.* 2>/dev/null | sort -V | tail -1)
            if [ -z "$NODE_DIR" ]; then
              echo "ERROR: Node 24 not found under /home/ubuntu/.nvm/versions/node/"
              ls -la /home/ubuntu/.nvm/versions/node/ 2>&1 || true
              exit 1
            fi
            export PATH="$NODE_DIR/bin:$PATH"
            echo "Using Node from: $NODE_DIR"
            node --version
            npm --version

            export NODE_OPTIONS="--max-old-space-size=768"
            echo "── Memory ──"
            free -h

            echo "── Building Storefront ──"
            cd apps/storefront
            rm -rf .nuxt .output .next dist node_modules/.cache
            npm ci
            npm run build
            rm -rf node_modules/.cache 2>/dev/null || true

            echo "── Building Admin ──"
            cd ../admin
            rm -rf .nuxt .output .next dist node_modules/.cache
            npm ci
            npm run build
            rm -rf node_modules/.cache 2>/dev/null || true

            echo "── Reloading PM2 ──"
            cd ../..
            pm2 reload ecosystem.config.js --update-env
            pm2 save

            sleep 5
            pm2 list

            echo "── Post-deploy cleanup ──"
            find apps -type d -name ".cache" -prune -exec rm -rf {} + 2>/dev/null || true
            rm -rf apps/*/.nuxt/cache apps/*/.next/cache 2>/dev/null || true
            npm cache clean --force 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true

            echo "── Final state ──"
            df -h .
            free -h
            echo "Deployment complete!"
