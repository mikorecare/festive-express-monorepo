name: Deploy Monorepo to AWS EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            cd /var/www/festive-express/festive-express-monorepo

            # ─── Preflight: disk space ────────────────────────────
            FREE_GB=$(( $(df --output=avail . | tail -1) / 1024 / 1024 ))
            echo "Free disk: ${FREE_GB}GB"
            if [ "$FREE_GB" -lt 3 ]; then
              echo "ERROR: Only ${FREE_GB}GB free. Aborting before fetch."
              df -h .
              exit 1
            fi

            # ─── Preflight: reclaim space BEFORE fetching ─────────
            echo "Reclaiming space before fetch..."
            pm2 flush 2>/dev/null || true
            npm cache clean --force 2>/dev/null || true
            rm -rf apps/*/.nuxt apps/*/.output apps/*/.next apps/*/dist 2>/dev/null || true
            find apps -type d -name ".cache" -prune -exec rm -rf {} + 2>/dev/null || true
            sudo journalctl --vacuum-size=200M 2>/dev/null || true
            sudo apt clean 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true
            df -h

            # ─── Fetch latest ─────────────────────────────────────
            echo "Pulling latest code from production branch..."
            git fetch origin production
            git reset --hard origin/production
            git log -1 --oneline

            # ─── Node environment ─────────────────────────────────
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20 2>/dev/null || nvm install 20
            node --version
            npm --version

            export NODE_OPTIONS="--max-old-space-size=768"
            echo "Available memory before build:"
            free -h

            # ─── BUILD STOREFRONT ─────────────────────────────────
            echo "========================================="
            echo "Building Storefront..."
            echo "========================================="
            cd apps/storefront

            # Clean BEFORE install so npm ci has room
            rm -rf .nuxt .output .next dist node_modules/.cache
            npm ci
            npm run build

            # Reclaim storefront build cache before admin
            rm -rf node_modules/.cache 2>/dev/null || true

            # ─── BUILD ADMIN ──────────────────────────────────────
            echo "========================================="
            echo "Building Admin..."
            echo "========================================="
            cd ../admin

            rm -rf .nuxt .output .next dist node_modules/.cache
            npm ci
            npm run build
            rm -rf node_modules/.cache 2>/dev/null || true

            # ─── RELOAD VIA PM2 ───────────────────────────────────
            echo "========================================="
            echo "Reloading PM2 apps..."
            echo "========================================="
            cd ../..

            pm2 reload ecosystem.config.js --update-env
            pm2 save

            # ─── Verify ───────────────────────────────────────────
            sleep 5
            echo "PM2 Status:"
            pm2 list

            if pm2 jlist 2>/dev/null | grep -q '"status":"errored"'; then
              echo "ERROR: Some PM2 processes are errored"
              pm2 list
              exit 1
            fi

            # ─── Post-deploy: reclaim space ───────────────────────
            echo "Post-deploy cleanup..."
            find apps -type d -name ".cache" -prune -exec rm -rf {} + 2>/dev/null || true
            rm -rf apps/*/.nuxt/cache apps/*/.next/cache 2>/dev/null || true
            npm cache clean --force 2>/dev/null || true
            git gc --prune=now 2>/dev/null || true

            # ─── Final report ─────────────────────────────────────
            echo ""
            echo "Final state:"
            df -h .
            free -h
            echo "========================================="
            echo "Deployment complete!"
            echo "========================================="
