name: Deploy Monorepo to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to monorepo root and pull code
            cd /var/www/festive-express/festive-express-monorepo
            git pull origin master

            # 2. Load Node/NVM environment rules
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 3. BUILD & DEPLOY APP 1: Storefront
            echo "Building Storefront..."
            cd /var/www/festive-express/festive-express-monorepo/apps/storefront
            npm install
            # Clean previous build to ensure fresh build
            rm -rf .output .nuxt
            npm run build

            # 4. BUILD & DEPLOY APP 2: Admin
            echo "Building Admin..."
            cd /var/www/festive-express/festive-express-monorepo/apps/admin
            npm install
            # Clean previous build to ensure fresh build
            rm -rf .output .nuxt
            npm run build

            # 5. RELOAD VIA PM2
            echo "Reloading applications with PM2..."
            cd /var/www/festive-express/festive-express-monorepo
            
            # Option A: Use restart instead of reload (more reliable)
            pm2 restart ecosystem.config.js --update-env
            
            # Option B: If you want zero-downtime, use reload but with force
            # pm2 reload ecosystem.config.js --update-env --force

            # 6. Save PM2 process list
            pm2 save

            # 7. Check status
            pm2 list

            # 8. Show recent logs for verification
            pm2 logs --lines 20 --nostream